repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/

  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black
        files: ^backend/

  - repo: local
    hooks:
      - id: mypy
        name: mypy (backend/app)
        entry: bash -c 'cd backend && uv run mypy app'
        language: system
        files: ^backend/app/.*\.py$
        pass_filenames: false

      - id: import-linter
        name: import-linter (backend)
        entry: bash -c 'cd backend && uv run lint-imports'
        language: system
        files: ^backend/app/.*\.py$
        pass_filenames: false

      - id: pytest
        name: pytest (backend)
        entry: bash -c 'cd backend && uv run pytest -q'
        language: system
        files: ^backend/(app|tests)/.*\.py$
        pass_filenames: false
