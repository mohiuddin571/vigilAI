[project]
name = "vigilai-backend"
version = "0.1.0"
description = "VigilAI backend — VMS with integrated video analytics"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "structlog>=24.4",
    "onvif-zeep-async>=3.1",
    "sqlmodel>=0.0.22",
    "aiosqlite>=0.20",
    "cryptography>=43.0",
    "greenlet>=3.5.4",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "black>=24.10",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "import-linter>=2.1",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "."
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = ["onvif.*", "zeep.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "--cov=app.domain --cov-report=term-missing --cov-fail-under=100 -m \"not hardware\""
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "hardware: requires the evaluator's physical ONVIF camera; skipped by default, run explicitly with -m hardware",
]

[tool.coverage.run]
source = ["app.domain"]
branch = true

[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = [
    "app.interfaces | app.infrastructure",
    "app.application",
    "app.domain",
]
