name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync

      - name: Ruff
        run: uv run ruff check .

      - name: Black
        run: uv run black --check .

      - name: Mypy
        run: uv run mypy app

      - name: Import-linter
        run: uv run lint-imports

      - name: Pytest
        # ENVIRONMENT/CAMERA_CREDENTIAL_ENCRYPTION_KEY: M3's integration tests
        # build the composition root, which instantiates Settings (TD-13) —
        # there's no .env in CI (it's gitignored), so these must come from the
        # job environment. The key here is CI-only and never used for real
        # credentials; each developer generates their own for local `.env`.
        run: uv run pytest
        env:
          ENVIRONMENT: development
          CAMERA_CREDENTIAL_ENCRYPTION_KEY: "Ajj431OAuadLObaWyK7E62xofPpQr_n0ck9eAE1Lczc="

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
